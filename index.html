<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" sizes="32x32" href="favicon.png" />
        <title>LogyFun - Link</title>

        <!-- Font -->
        <link
            href="https://fonts.googleapis.com/css2?family=Coustard&display=swap"
            rel="stylesheet"
        />

        <!-- Icons -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        />

        <style>
            @font-face {
                font-family: "The Youngest";
                src: url("TheYoungest.ttf") format("truetype");
            }

            :root {
                --bg: #f8f7f2;
                --primary: #4e1510;
                --white: #ffffff;
                --border: #e8e5df;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: #eae7e2;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                font-family: "Coustard", serif;
            }

            /* MOBILE FRAME */
            .mobile-frame {
                width: 390px;
                height: 100vh;
                max-height: 820px;
                background: var(--bg);
                border-radius: 28px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
                overflow-y: auto;
                padding: 28px 20px;
                text-align: center;
                color: var(--primary);

                display: flex;
                flex-direction: column;
            }

            @media (max-width: 420px) {
                .mobile-frame {
                    width: 100%;
                    height: 100vh;
                    border-radius: 0;
                    box-shadow: none;
                }
            }

            .content {
                flex: 1;
            }

            .logo-img {
                width: 160px;
                margin: 0 auto 12px;
            }

            .brand {
                font-family: "The Youngest", serif;
                font-size: 40px;
                margin-bottom: 6px;
                margin-top: 50px;
            }

            .divider {
                width: 200px;
                height: 2px;
                background: var(--primary);
                margin: 8px auto;
            }

            .tagline {
                font-size: 14px;
                margin-bottom: 20px;
                letter-spacing: 1px;
            }

            /* SECTION BREAK */
            .links {
                display: flex;
                flex-direction: column;
                gap: 16px;
                margin-top: 65px;
            }

            .link-btn {
                display: flex;
                align-items: center;
                justify-content: center; /* ini yang bikin teks center */
                gap: 12px;
                padding: 15px 16px;
                border-radius: 14px;
                background: var(--white);
                border: 1px solid var(--border);
                text-decoration: none;
                color: var(--primary);
                font-size: 15px;
                transition: all 0.25s ease;
            }

            .link-btn i {
                font-size: 18px;
                color: var(--primary);
                opacity: 0.8;
            }

            .link-btn:hover {
                background: var(--primary);
                color: var(--white);
                transform: translateY(-2px);
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            }

            .link-btn:hover i {
                color: var(--white);
                opacity: 1;
            }

            .footer {
                margin-top: auto;
                font-size: 12px;
                opacity: 0.6;
                padding-top: 20px;
            }
        </style>
    </head>

    <body>
        <div class="mobile-frame">
            <div class="content">
                <!-- Logo -->
                <!-- <img src="logo.png" alt="LogyFun Logo" class="logo-img" /> -->

                <!-- Brand -->
                <div class="brand">LogyFun</div>
                <div class="divider"></div>
                <div class="tagline">make learning feel easy</div>

                <!-- Links -->
                <div class="links">
                    <a
                        href="https://logyfun.com"
                        target="_blank"
                        class="link-btn"
                    >
                        <i class="fa-solid fa-globe"></i>
                        Website
                    </a>

                    <a href="#" class="link-btn">
                        <i class="fa-brands fa-instagram"></i>
                        Instagram
                    </a>

                    <a
                        href="https://wa.me/6283899296895"
                        target="_blank"
                        class="link-btn"
                    >
                        <i class="fa-brands fa-whatsapp"></i>
                        WhatsApp
                    </a>

                    <a href="#" class="link-btn">
                        <i class="fa-solid fa-tag"></i>
                        Pricing
                    </a>

                    <a href="#" class="link-btn">
                        <i class="fa-solid fa-calendar-check"></i>
                        Get Free Assessment
                    </a>

                    <a href="#" class="link-btn">
                        <i class="fa-solid fa-chalkboard-user"></i>
                        Join as Tutor
                    </a>
                </div>
            </div>

            <!-- Footer (fix bawah) -->
            <div class="footer">© 2026 LogyFun</div>
        </div>
    </body>
</html>
