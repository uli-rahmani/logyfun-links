<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>LogyFun</title>

        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        />

        <link rel="icon" type="image/png" href="favicon.png" />
        <!-- Google tag (gtag.js) -->
        <script
            async
            src="https://www.googletagmanager.com/gtag/js?id=G-2PN8F5K7JE"
        ></script>

        <script>
            window.dataLayer = window.dataLayer || [];
            function gtag() {
                dataLayer.push(arguments);
            }
            gtag("js", new Date());

            gtag("config", "G-2PN8F5K7JE");

        <style>
            @font-face {
                font-family: "AvantGarde";
                src: url("ITCAvantGardePro-Md.ttf") format("opentype");
            }

            @font-face {
                font-family: "GUNTERZ";
                src: url("GUNTERZ-Regular.otf") format("opentype");
            }

            :root {
                --primary: #f17f29;
                --secondary: #503047;
                --white: #ffffff;
                --green: #adc698;
                --cream: #d0e3c4;
                --bg: #f7f7f5;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: #e9e9e9;
                font-family: "AvantGarde", sans-serif;
                display: flex;
                justify-content: center;
                align-items: center;
                min-height: 100vh;
                padding: 20px;
            }

            .mobile-frame {
                width: 390px;
                height: 100vh;
                max-height: 844px;
                background: var(--bg);
                border-radius: 32px;
                overflow-y: auto;
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
                padding: 28px 22px;
                display: flex;
                flex-direction: column;
            }

            @media (max-width: 420px) {
                body {
                    padding: 0;
                }

                .mobile-frame {
                    width: 100%;
                    height: 100vh;
                    border-radius: 0;
                    max-height: 100vh;
                }
            }

            .content {
                flex: 1;
            }

            .logo-wrapper {
                display: flex;
                justify-content: center;
                margin-top: 10px;
            }

            .logo-img {
                width: 240px;
                object-fit: contain;
            }

            .headline {
                margin-top: 28px;
                text-align: center;
            }

            .headline-title {
                font-family: "AvantGarde", sans-serif;
                font-size: 15px;
                color: var(--secondary);
                letter-spacing: 1px;
                line-height: 1.6;
            }

            .headline-subtitle {
                margin-top: 10px;
                font-family: "GUNTERZ", sans-serif;
                font-size: 12px;
                color: var(--primary);
                letter-spacing: 3px;
            }

            .links {
                margin-top: 10px;
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            .link-btn {
                width: 100%;

                display: flex;
                align-items: center;
                justify-content: center;
                gap: 14px;
                padding: 16px 18px;
                text-decoration: none;
                background: var(--white);
                border: 2px solid transparent;
                border-radius: 18px;
                color: var(--secondary);
                font-size: 15px;
                transition: 0.25s ease;
                box-shadow: 0 8px 18px rgba(0, 0, 0, 0.04);
            }

            .link-btn i {
                font-size: 18px;
                color: var(--primary);
            }

            .link-btn:hover {
                background: var(--primary);
                color: var(--white);
                transform: translateY(-2px);
                box-shadow: 0 14px 24px rgba(241, 127, 41, 0.25);
            }

            .link-btn:hover i {
                color: var(--white);
            }

            .primary-btn {
                background: var(--primary);
                color: var(--white);
            }

            .primary-btn i {
                color: var(--white);
            }

            .primary-btn:hover {
                background: var(--secondary);
                box-shadow: 0 14px 24px rgba(80, 48, 71, 0.25);
            }

            .footer {
                margin-top: auto;
                padding-top: 24px;
                text-align: center;
                font-size: 11px;
                font-weight: bold;
                color: #503047;
                letter-spacing: 1px;
            }
        </style>
    </head>

    <body>
        <div class="mobile-frame">
            <div class="content">
                <div class="logo-wrapper">
                    <img src="logo.png" alt="LogyFun" class="logo-img" />
                </div>

                <div class="links">
                    <a
                        href="https://forms.gle/GViF1tH8E9YinQnMA"
                        target="_blank"
                        class="link-btn"
                    >
                        <i class="fa-solid fa-calendar-check"></i>
                        Book Free Assessment
                    </a>

                    <a
                        href="https://logyfun.com"
                        target="_blank"
                        class="link-btn"
                    >
                        <i class="fa-solid fa-globe"></i>
                        Website
                    </a>

                    <a
                        href="https://www.instagram.com/logyfun/"
                        target="_blank"
                        class="link-btn"
                    >
                        <i class="fa-brands fa-instagram"></i>
                        Instagram
                    </a>

                    <a
                        href="https://wa.me/6283899296895"
                        target="_blank"
                        class="link-btn"
                    >
                        <i class="fa-brands fa-whatsapp"></i>
                        WhatsApp
                    </a>

                    <!-- <a href="#" class="link-btn">
                        <i class="fa-solid fa-user-plus"></i>
                        Pricing
                    </a> -->
                </div>
            </div>

            <div class="footer">© 2026 LogyFun</div>
        </div>
    </body>
</html>
